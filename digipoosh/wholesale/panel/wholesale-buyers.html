<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="robots" content="noindex" />
  <title>مشتریان | پنل عمده‌فروشی دیجی‌پوش</title>

  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../assets/css/dp-font.css" />
  <link rel="stylesheet" href="./css/wholesale-panel.css" />
  <link rel="stylesheet" href="../../assets/css/dp-cursor.css" />
  <link rel="stylesheet" href="../../assets/css/dp-stock.css" />
</head>
<body data-dp-page="wholesale-panel">
<a class="dp-skip" href="#main">پرش به محتوای اصلی</a>

<aside class="wp-side" id="wpSide"></aside>

<main class="wp-main" id="main">

  <header class="wp-top">
    <button class="wp-burger" type="button" id="wpBurger" aria-label="منو">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="wp-title">
      <h1>مشتریان</h1>
      <span>خریداران عمده و سابقه‌شان</span>
    </div>
    <div class="wp-top-acts"></div>
  </header>

  <div class="wp-content">
    <div class="wp-note">
      <svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <div><b>مشتریان عمده خودکار از سفارش‌ها ساخته می‌شوند.</b>
        می‌توانید برای هرکدام یادداشت و سقف اعتبار بگذارید تا در معامله‌های بعدی
        یادتان بماند با چه کسی طرف‌اید.</div>
    </div>

    <div class="wp-card">
      <div class="wp-card-head">
        <h2>مشتریان عمده</h2>
        <span class="sub spacer" id="count">—</span>
      </div>
      <div id="box"></div>
    </div>
  </div>

</main>

<div class="wp-modal" id="bModal" role="dialog" aria-modal="true" aria-label="یادداشت مشتری">
  <div class="wp-modal-card" style="width:min(520px,100%)">
    <button class="wp-x" type="button" data-wp-close aria-label="بستن"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <h2 id="bTitle">یادداشت مشتری</h2>
    <form id="bForm" novalidate>
      <input type="hidden" id="bKey" />
      <div class="wp-grid">
        <div class="wp-field">
          <label for="bTag">برچسب</label>
          <select class="wp-input" id="bTag">
            <option value="">بدون برچسب</option>
            <option value="vip">مشتری ویژه</option>
            <option value="regular">مشتری دائمی</option>
            <option value="new">تازه‌وارد</option>
            <option value="risk">نیازمند احتیاط</option>
          </select>
        </div>
        <div class="wp-field">
          <label for="bCredit">سقف اعتبار (تومان)</label>
          <input class="wp-input" id="bCredit" inputmode="numeric" placeholder="۰ یعنی بدون اعتبار" />
        </div>
        <div class="wp-field full">
          <label for="bNote">یادداشت</label>
          <textarea class="wp-input" id="bNote" rows="4"
            placeholder="شرایط پرداخت، ترجیح‌ها، نکته‌های مهم…"></textarea>
        </div>
      </div>
      <div class="wp-modal-foot">
        <button class="wp-btn wp-btn-gold" type="submit">ذخیره</button>
        <button class="wp-btn wp-btn-ghost" type="button" data-wp-close>انصراف</button>
      </div>
    </form>
  </div>
</div>

<script src="../../seller/js/dp-config.js"></script>
<script src="../../seller/js/dp-store.js"></script>
<script src="../../assets/js/dp-guard.js"></script>
<script src="../../assets/js/dp-safe.js"></script>
<script src="../../assets/js/dp-stock.js"></script>
<script src="../../assets/js/dp-taxonomy.js"></script>
<script src="../../assets/js/dp-moderation.js"></script>
<script src="../../assets/js/dp-reviews.js"></script>
<script src="../../assets/js/dp-user.js"></script>
<script src="./js/dpw-store.js"></script>
<script src="./js/dpw-boost.js"></script>
<script src="./js/dpw-ui.js"></script>
<script>

requireWholesale(function () {
  var S = DPWStore, U = DPWUi, esc = U.esc;
  var fa = S.fa, money = S.money;
  var $ = function (s) { return document.querySelector(s); };

  var TAG = {
    vip:     { fa: 'مشتری ویژه', cls: 'gold' },
    regular: { fa: 'دائمی', cls: 'ok' },
    new:     { fa: 'تازه‌وارد', cls: 'info' },
    risk:    { fa: 'احتیاط', cls: 'bad' },
  };

  function paint() {
    var list = S.buyers.list();
    $('#count').textContent = fa(list.length) + ' مشتری';

    if (!list.length) {
      $('#box').innerHTML = U.emptyBox('هنوز مشتری‌ای نیست',
        'با نخستین سفارش، مشتری خودکار اینجا ثبت می‌شود.');
      return;
    }

    $('#box').innerHTML = '<div class="wp-table-wrap"><table class="wp-table"><thead><tr>' +
      '<th>مشتری</th><th>سفارش</th><th>خرید کل</th><th>پرداختی</th>' +
      '<th>مانده</th><th>آخرین خرید</th><th></th></tr></thead><tbody>' +
      list.map(function (b) {
        var due = Math.max(0, b.total - b.paid);
        var t = TAG[b.tag];
        return '<tr>' +
          '<td><b>' + esc(b.name) + '</b>' +
            (t ? ' <span class="wp-tag ' + t.cls + '">' + t.fa + '</span>' : '') +
            '<span class="wp-tiny">' +
              (b.company ? esc(b.company) + ' · ' : '') + esc(b.phone || '—') + '</span>' +
            (b.note ? '<span class="wp-tiny" style="color:var(--wp-gold-l)">' +
              esc(b.note.slice(0, 60)) + '</span>' : '') + '</td>' +
          '<td class="num">' + fa(b.orders) + '</td>' +
          '<td class="num">' + money(b.total) + '</td>' +
          '<td class="num">' + money(b.paid) + '</td>' +
          '<td class="num">' + (due
            ? '<span style="color:var(--wp-bad)">' + money(due) + '</span>' +
              (b.credit ? '<span class="wp-tiny">سقف ' + money(b.credit) + '</span>' : '')
            : '<span class="wp-tag ok">تسویه</span>') + '</td>' +
          '<td class="muted">' + esc(b.lastDate || '—') + '</td>' +
          '<td><button class="wp-btn wp-btn-ghost wp-btn-sm" type="button" data-note="' +
            esc(b.key) + '">یادداشت</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-note]');
    if (!b) return;
    var key = b.dataset.note;
    var rec = S.buyers.list().find(function (x) { return x.key === key; });
    if (!rec) return;
    $('#bTitle').textContent = 'یادداشت — ' + rec.name;
    $('#bKey').value = key;
    $('#bTag').value = rec.tag || '';
    $('#bCredit').value = rec.credit ? fa(rec.credit) : '';
    $('#bNote').value = rec.note || '';
    U.openModal('#bModal');
  });

  $('#bForm').addEventListener('submit', function (e) {
    e.preventDefault();
    S.buyers.setNote($('#bKey').value, {
      tag: $('#bTag').value,
      credit: $('#bCredit').value,
      note: $('#bNote').value,
    });
    U.closeModal($('#bModal'));
    U.toast('یادداشت ذخیره شد.', 'success');
    paint();
  });

  document.addEventListener('dpw:change', paint);
  paint();
});
</script>
</body>
</html>
