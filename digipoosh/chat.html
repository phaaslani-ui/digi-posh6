<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چت با دیجی AI | دیجی‌پوش</title>
  <link rel="stylesheet" href="./assets/css/dp-ai-chat.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    }
    .header h1 {
      font-size: 28px;
      color: #d4af37;
      margin-bottom: 8px;
    }
    .header p {
      color: #aaa;
      font-size: 14px;
    }
    .header a {
      color: #d4af37;
      text-decoration: none;
      margin-left: 15px;
    }
    .chat-container {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 75%;
      padding: 12px 18px;
      border-radius: 18px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #d4af37, #b8941f);
      color: #1a1a2e;
      font-weight: 500;
    }
    .message.bot {
      align-self: flex-start;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(212, 175, 55, 0.2);
      color: #fff;
    }
    .message.error {
      align-self: flex-start;
      background: rgba(255, 0, 0, 0.15);
      border: 1px solid rgba(255, 0, 0, 0.3);
      color: #ff6b6b;
    }
    .message.typing {
      align-self: flex-start;
      background: rgba(255,255,255,0.08);
      color: #aaa;
    }
    .input-area {
      display: flex;
      gap: 10px;
      padding: 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 20px 20px 0 0;
    }
    .input-area input {
      flex: 1;
      padding: 14px 20px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 25px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }
    .input-area input:focus {
      border-color: #d4af37;
    }
    .input-area button {
      padding: 14px 28px;
      background: linear-gradient(135deg, #d4af37, #b8941f);
      border: none;
      border-radius: 25px;
      color: #1a1a2e;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .quick-actions {
      display: flex;
      gap: 8px;
      padding: 0 20px 15px;
      flex-wrap: wrap;
    }
    .quick-actions button {
      padding: 8px 16px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      color: #d4af37;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }
    .quick-actions button:hover {
      background: rgba(212, 175, 55, 0.2);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 دیجی AI</h1>
    <p>دستیار هوشمند مد و استایل فارسی</p>
    <a href="./index.html">بازگشت به سایت</a>
  </div>

  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="message bot">
        سلام! 👋 من دیجی AI هستم، دستیار هوشمند شما در دیجی‌پوش.

می‌تونم کمکتون کنم با:
✨ پیشنهاد استایل و ست لباس
🎨 مشاوره رنگ
📰 ترندهای روز مد
💡 راهنمای سایز

هر سوالی دارید بپرسید!
      </div>
    </div>

    <div class="quick-actions">
      <button onclick="sendQuick('یه ست برای عید پیشنهاد بده')">🎉 ست عید</button>
      <button onclick="sendQuick('چه رنگی به من میاد؟')">🎨 مشاوره رنگ</button>
      <button onclick="sendQuick('ترندهای روز')">📰 ترندها</button>
      <button onclick="sendQuick('چطور شلوار مناسب انتخاب کنم؟')">👖 راهنمای شلوار</button>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="سوالت رو بنویس..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">ارسال</button>
    </div>
  </div>

  <script src="./dp-products-hub.js"></script>
  <script src="./dp-products-feed-v2.js"></script>
  <script src="./seller/js/dp-config.js"></script>
        <script src="./dp-ai-nlu.js"></script>
    <script src="./dp-chat-ai.js"></script>
  <script>
    const WORKER_URL = 'https://digiposh.phaaslani.workers.dev';
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const history = [];

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'message ' + type;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function sendQuick(text) {
      inputEl.value = text;
      sendMessage();
    }

    async function sendMessage() {
      const msg = inputEl.value.trim();
      if (!msg) return;

      addMessage(msg, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;
      sendBtn.textContent = '...';

      history.push({ role: 'user', content: msg });

      const typing = document.createElement('div');
      typing.className = 'message typing';
      typing.textContent = 'در حال فکر کردن...';
      messagesEl.appendChild(typing);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        // 🆕 v17.3 — استفاده از DPChatAI محلی (worker غیرفعال بود)
        if (window.DPChatAI && window.DPChatAI.generateResponse) {
          const response = window.DPChatAI.generateResponse(msg, { history: history });
          typing.remove();
          if (response && response.text) {
            addMessage(response.text, 'bot');
            history.push({ role: 'assistant', content: response.text });
            
            // رندر محصولات اگه باشن
            if (response.products && response.products.length > 0) {
              renderChatProducts(response.products);
            }
          } else {
            addMessage('😊 بگو، گوش میدم!', 'bot');
          }
        } else {
          typing.remove();
          addMessage('🤖 در حال بارگذاری... دوباره تلاش کن.', 'error');
        }
      } catch (e) {
        typing.remove();
        addMessage('❌ خطا: ' + e.message, 'error');
      }

      sendBtn.disabled = false;
      sendBtn.textContent = 'ارسال';
      inputEl.focus();
    }

    inputEl.focus();
  </script>
</body>
</html>
