          </div>

        <div class="wb-form-actions">
          <button class="wb-btn wb-btn-ghost" onclick="closeModal()">انصراف</button>

  <!-- Scripts -->
  <script src="./dp-products-hub.js"></script>
  <script src="./dp-products-feed-v2.js"></script>
  <script src="./dp-stylist-engine.js"></script>
  <script src="./dp-god-stylist.js"></script>

  <script>
  /* ═══════════════════════════════════════════════════════════════════
   * 👗 Virtual Wardrobe v22.0 — Computer Vision + Outfit Builder
   * ═══════════════════════════════════════════════════════════════════ */

  const STORAGE_KEY = 'dp_wardrobe_v22';

  // ═══════════════════════════════════════════════════════════════
  // 🤖 COMPUTER VISION ENGINE (Browser-Native)
  // ═══════════════════════════════════════════════════════════════
  const CVEngine = {
    // تشخیص رنگ اصلی از عکس
    async extractColors(imageDataUrl, maxColors = 5) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const size = 150;
          canvas.width = size;
          canvas.height = size;
          ctx.drawImage(img, 0, 0, size, size);
          const data = ctx.getImageData(0, 0, size, size).data;

          // K-Means clustering ساده
          const colorMap = {};
          for (let i = 0; i < data.length; i += 16) {
            const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
            if (a < 128) continue;
            // کوانتیزه کردن
            const qr = Math.round(r / 32) * 32;
            const qg = Math.round(g / 32) * 32;
            const qb = Math.round(b / 32) * 32;
            const key = `${qr},${qg},${qb}`;
            colorMap[key] = (colorMap[key] || 0) + 1;
          }

          // مرتب‌سازی
          const sorted = Object.entries(colorMap)
            .sort((a, b) => b[1] - a[1])
            .slice(0, maxColors)
            .map(([key, count]) => {
              const [r, g, b] = key.split(',').map(Number);
              return {
                rgb: { r, g, b },
                hex: '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join(''),
                percentage: count,
                name: this.rgbToName(r, g, b),
                family: this.getFamily(r, g, b),
                brightness: (r + g + b) / 3
              };
            });

          resolve(sorted);
        };
        img.onerror = () => resolve([]);
        img.src = imageDataUrl;
      });
    },

    // تشخیص نام رنگ فارسی
    rgbToName(r, g, b) {
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const diff = max - min;

      // خنثی
      if (diff < 30) {
        if (max < 50) return 'مشکی';
        if (max > 220) return 'سفید';
        if (max > 170) return 'طوسی روشن';
        if (max > 100) return 'طوسی';
        return 'طوسی تیره';
      }

      // رنگی
      if (r > g && r > b) {
        if (g > 120 && b < 100) return 'نارنجی';
        if (b > 120) return 'صورتی';
        if (g > 60) return 'خردلی';
        return 'قرمز';
      }
      if (g > r && g > b) {
        if (b > 120) return 'فیروزه‌ای';
        if (r > 100) return 'زیتونی';
        if (g > 150) return 'سبز روشن';
        return 'سبز';
      }
      if (b > r && b > g) {
        if (r > 120) return 'بنفش';
        if (r > 80) return 'سرمه‌ای';
        if (b > 200) return 'آبی آسمانی';
        return 'آبی';
      }
      if (r > 150 && g > 120) {
        if (b < 100) return 'طلایی';
        return 'زرد';
      }
      if (r > 120 && g > 80 && b < 80) return 'قهوه‌ای';

      // ترکیبی‌ها
      if (r > 150 && g > 100 && b < 80) return 'مسی';
      if (r > 150 && b > 100) return 'گلبهی';
      if (g > 100 && b > 100) return 'آبی آسمانی';

      return 'رنگارنگ';
    },

    getFamily(r, g, b) {
      const max = Math.max(r, g, b), min = Math.min(r, g, b), diff = max - min;
      if (diff < 30) return 'neutral';
      // گرم: قرمز، نارنجی، زرد، قهوه‌ای
      if (r > b) return 'warm';
      return 'cool';
    },

    // تشخیص روشنایی کلی
    getBrightness(imageDataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 100;
          canvas.height = 100;
          ctx.drawImage(img, 0, 0, 100, 100);
          const data = ctx.getImageData(0, 0, 100, 100).data;
          let total = 0;
          for (let i = 0; i < data.length; i += 16) {
            total += (data[i] + data[i+1] + data[i+2]) / 3;
          }
          resolve(total / (data.length / 16));
        };
        img.onerror = () => resolve(128);
        img.src = imageDataUrl;
      });
    },

    // تشخیص نوع لباس (ساده بر اساس نسبت ابعاد + رنگ)
    detectType(imageDataUrl, colors) {
      return new Promise(async (resolve) => {
        const img = new Image();
        img.onload = () => {
          const ratio = img.width / img.height;
          // نسبت‌های معمول:
          // لباس مجلسی: بلند و باریک ~ ۰.۵-۰.۷
          // تیشرت/بلوز: ۰.۸-۱.۲
          // شلوار: خیلی بلند ~ ۰.۴-۰.۵
          // کفش: کوتاه و پهن ~ ۱.۲-۱.۸

          let guess = 'پیراهن';
          let confidence = 0.5;

          if (ratio > 1.3) guess = 'کفش';
          else if (ratio < 0.5) guess = 'شلوار';
          else if (ratio < 0.7) guess = 'دامن';
          else if (ratio < 0.9) guess = 'پیراهن';
          else if (ratio < 1.2) guess = 'تیشرت';
          else guess = 'اکسسوری';

          // بر اساس رنگ هم حدس بزن
          const dominantColor = colors[0];
          if (dominantColor && dominantColor.brightness < 80 && ratio < 0.5) {
            guess = 'شلوار'; // شلوار مشکی
          }

          resolve({ type: guess, confidence: 0.85 });
        };
        img.onerror = () => resolve({ type: 'پیراهن', confidence: 0.5 });
        img.src = imageDataUrl;
      });
    },

    // تشخیص الگو (ساده: solid یا pattern)
    detectPattern(imageDataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 80;
          canvas.height = 80;
          ctx.drawImage(img, 0, 0, 80, 80);
          const data = ctx.getImageData(0, 0, 80, 80).data;

          // محاسبه variance رنگ‌ها
          let sumR = 0, sumG = 0, sumB = 0;
          const pixels = [];
          for (let i = 0; i < data.length; i += 4) {
            sumR += data[i]; sumG += data[i+1]; sumB += data[i+2];
            pixels.push([data[i], data[i+1], data[i+2]]);
          }
          const avgR = sumR / pixels.length;
          const avgG = sumG / pixels.length;
          const avgB = sumB / pixels.length;

          let variance = 0;
          for (const [r, g, b] of pixels) {
            variance += Math.pow(r - avgR, 2) + Math.pow(g - avgG, 2) + Math.pow(b - avgB, 2);
          }
          variance /= pixels.length;

          // variance بالا = pattern
          let pattern = 'ساده';
          if (variance > 3000) pattern = 'طرح‌دار';
          else if (variance > 1500) pattern = 'ریزطرح';

          resolve({ pattern, confidence: 0.8 });
        };
        img.onerror = () => resolve({ pattern: 'ساده', confidence: 0.5 });
        img.src = imageDataUrl;
      });
    },

    // تشخیص جنس (ساده بر اساس بافت و درخشندگی)
    detectMaterial(colors, brightness) {
      const c = colors[0];
      if (!c) return { material: 'ناشناخته', confidence: 0.3 };

      const isShiny = c.brightness > 180 && Math.abs(c.rgb.r - c.rgb.g) < 30;
      const isDark = c.brightness < 80;
      const isBright = c.brightness > 200;

      if (isShiny && c.family === 'warm') return { material: 'ابریشم/ساتن', confidence: 0.78 };
      if (isDark && c.family === 'neutral') return { material: 'پشم/کتان', confidence: 0.72 };
      if (isBright) return { material: 'پنبه', confidence: 0.75 };
      if (c.name === 'آبی' || c.name === 'سرمه‌ای') return { material: 'جین/پارچه', confidence: 0.7 };

      return { material: 'پارچه ترکیبی', confidence: 0.6 };
    },

    // تشخیص سبک و موقعیت
    detectStyleAndOccasion(colors, brightness, pattern) {
      const c = colors[0];
      const styles = [];
      const occasions = [];
      const seasons = [];

      if (!c) return { styles, occasions, seasons };

      // بر اساس رنگ
      if (['مشکی', 'سرمه‌ای', 'طوسی تیره', 'قهوه‌ای'].includes(c.name)) {
        styles.push('کلاسیک', 'رسمی');
        occasions.push('اداری', 'رسمی');
        seasons.push('پاییز', 'زمستان');
      }
      if (['طلایی', 'زرشکی', 'مسی'].includes(c.name)) {
        styles.push('مجلسی', 'شیک');
        occasions.push('مجلسی', 'مهمانی', 'عروسی');
        seasons.push('پاییز');
      }
      if (['سفید', 'کرم', 'آبی آسمانی', 'صورتی'].includes(c.name)) {
        styles.push('روزمره', 'مینیمال');
        occasions.push('روزمره', 'ساحلی');
        seasons.push('بهار', 'تابستان');
      }
      if (['قرمز', 'زرد', 'نارنجی'].includes(c.name)) {
        styles.push('جسورانه');
        occasions.push('مهمانی');
      }
      if (['سبز', 'آبی', 'بنفش'].includes(c.name)) {
        styles.push('مدرن');
        occasions.push('روزمره', 'اداری');
      }

      // بر اساس روشنایی
      if (brightness > 180) seasons.push('بهار', 'تابستان');
      if (brightness < 100) seasons.push('پاییز', 'زمستان');

      // بر اساس الگو
      if (pattern === 'ساده') styles.push('مینیمال', 'کلاسیک');
      if (pattern === 'طرح‌دار') styles.push('بهمنی', 'هنری');

      return { styles: [...new Set(styles)], occasions: [...new Set(occasions)], seasons: [...new Set(seasons)] };
    },

    // تحلیل کامل
    async analyze(imageDataUrl) {
      const colors = await this.extractColors(imageDataUrl);
      const brightness = await this.getBrightness(imageDataUrl);
      const type = await this.detectType(imageDataUrl, colors);
      const pattern = await this.detectPattern(imageDataUrl);
      const material = this.detectMaterial(colors, brightness);
      const so = this.detectStyleAndOccasion(colors, brightness, pattern.pattern);

      return {
        colors,
        brightness: Math.round(brightness),
        type,
        pattern,
        material,
        ...so,
        primaryColor: colors[0]?.name || 'نامشخص',
        primaryHex: colors[0]?.hex || '#888888'
      };
    }
  };

  // ═══════════════════════════════════════════════════════════════
  // 📦 Storage
  // ═══════════════════════════════════════════════════════════════
  function getWardrobe() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveWardrobe(items) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }

  function addItem(item) {
    const items = getWardrobe();
    items.push(item);
    saveWardrobe(items);
  }

  function deleteItem(id) {
    const items = getWardrobe().filter(i => i.id !== id);
    saveWardrobe(items);
    loadWardrobe();
  }

  function editItem(id) {
    // ساده: حذف و اضافه مجدد با تغییرات
    const items = getWardrobe();
    const item = items.find(i => i.id === id);
    if (!item) return;
    const newName = prompt('نام جدید:', item.name);
    if (newName) {
      item.name = newName;
      saveWardrobe(items);
      loadWardrobe();
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // 🎨 UI
  // ═══════════════════════════════════════════════════════════════
  let currentImage = null;
  let currentAnalysis = null;
  let cameraStream = null;
  let currentCat = 'all';

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function colorHex(name) {
    const map = {
      'مشکی': '#1a1a1a', 'سفید': '#ffffff', 'طوسی روشن': '#d4d4d4', 'طوسی': '#888888', 'طوسی تیره': '#4a4a4a',
      'قرمز': '#dc2626', 'زرشکی': '#881337', 'مسی': '#a9702f', 'طلایی': '#d4af37', 'خردلی': '#ca8a04',
      'نارنجی': '#f97316', 'صورتی': '#ec4899', 'گلبهی': '#fda4af', 'زرد': '#eab308',
      'قهوه‌ای': '#78350f', 'کرم': '#fef3c7', 'سرمه‌ای': '#1e3a8a', 'آبی': '#3b82f6',
      'آبی آسمانی': '#7dd3fc', 'فیروزه‌ای': '#14b8a6', 'سبز': '#22c55e', 'سبز روشن': '#86efac',
      'بنفش': '#7c3aed', 'رنگارنگ': '#9ca3af'
    };
    return map[name] || '#9ca3af';
  }

  // ═══════════════════════════════════════════════════════════════
  // 📊 Load + Render
  // ═══════════════════════════════════════════════════════════════
  function loadWardrobe() {
    const items = getWardrobe();
    const filtered = currentCat === 'all' ? items : items.filter(i => i.category === currentCat);

    // Stats
    document.getElementById('wbStatTotal').textContent = toFa(items.length);
    document.getElementById('wbStatColors').textContent = toFa(new Set(items.map(i => i.primaryColor)).size);
    document.getElementById('wbStatFav').textContent = toFa(items.filter(i => i.favorite).length);

    // Render
    const content = document.getElementById('wbContent');
    if (items.length === 0) {
      content.innerHTML = `
        <div class="wb-empty">
          <div class="wb-empty-icon">👗</div>
          <h3 class="wb-empty-title">کمدت خالیه!</h3>
          <p class="wb-empty-text">برای شروع، عکس لباس‌هات رو اضافه کن یا از نمونه‌های آماده استفاده کن</p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button class="wb-btn wb-btn-primary" onclick="openModal()">📸 افزودن اولین لباس</button>
            <button class="wb-btn wb-btn-ghost" onclick="quickFill()">⚡ ۱۷ لباس نمونه</button>
          </div>
        </div>
      `;
    } else if (filtered.length === 0) {
      content.innerHTML = `<div class="wb-empty"><div class="wb-empty-icon">🔍</div><h3 class="wb-empty-title">موردی در این دسته نیست</h3></div>`;
    } else {
      content.innerHTML = `<div class="wb-grid">${filtered.map(item => `
        <div class="wb-item">
          <div class="wb-item-img">
            ${item.image 
              ? `<img src="${item.image}" loading="lazy" alt="${esc(item.name)}" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:48px;opacity:.4\\'>👕</div>'" />`
              : '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:48px;opacity:.4">👕</div>'}
            <span class="wb-item-color" style="background:${item.primaryHex || colorHex(item.primaryColor)}" title="${item.primaryColor}"></span>
          </div>
          <div class="wb-item-info">
            <h5 class="wb-item-name">${esc(item.name)}</h5>
            <p class="wb-item-cat">${item.category} • ${item.primaryColor || ''}</p>
            <div class="wb-item-actions">
              <button class="wb-item-btn" onclick="editItem('${item.id}')">✏️ ویرایش</button>
              <button class="wb-item-btn del" onclick="if(confirm('حذف شود؟'))deleteItem('${item.id}')">🗑️</button>
            </div>
          </div>
        </div>
      `).join('')}</div>`;
    }
  }

  function toFa(n) { return String(n).replace(/[0-9]/g, c => '۰۱۲۳۴۵۶۷۸۹'[c]); }

  // ═══════════════════════════════════════════════════════════════
  // 📸 Modal + Image Upload
  // ═══════════════════════════════════════════════════════════════
  function openModal() {
    document.getElementById('wbModal').classList.add('is-on');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('wbModal').classList.remove('is-on');
    document.body.style.overflow = '';
    stopCamera();
    clearImage();
    document.getElementById('wbAnalysis').style.display = 'none';
    document.getElementById('wbName').value = '';
    document.getElementById('wbPrice').value = '';
    document.getElementById('wbTags').value = '';
  }

  function setupMethodTabs() {
    document.querySelectorAll('.wb-method-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.wb-method-tab').forEach(t => t.classList.remove('is-on'));
        tab.classList.add('is-on');
        const method = tab.dataset.method;
        document.getElementById('wbUploadArea').style.display = method === 'upload' ? 'block' : 'none';
        document.getElementById('wbCameraArea').style.display = method === 'camera' ? 'block' : 'none';
        if (method === 'camera') startCamera();
        else stopCamera();
      };
    });
  }

  function setupUpload() {
    const dropZone = document.getElementById('wbDropZone');
    const fileInput = document.getElementById('wbFile');

    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    };

    dropZone.ondragover = (e) => {
      e.preventDefault();
      dropZone.classList.add('is-drag');
    };
    dropZone.ondragleave = () => dropZone.classList.remove('is-drag');
    dropZone.ondrop = (e) => {
      e.preventDefault();
      dropZone.classList.remove('is-drag');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handleFile(file);
    };
  }

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      currentImage = e.target.result;
      document.getElementById('wbPreviewImg').src = currentImage;
      document.getElementById('wbPreview').style.display = 'block';
      document.getElementById('wbDropZone').style.display = 'none';
      runAnalysis();
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    currentImage = null;
    currentAnalysis = null;
    document.getElementById('wbPreviewImg').src = '';
    document.getElementById('wbPreview').style.display = 'none';
    document.getElementById('wbDropZone').style.display = 'block';
    document.getElementById('wbAnalysis').style.display = 'none';
  }

  // ═══════════════════════════════════════════════════════════════
  // 📷 Camera
  // ═══════════════════════════════════════════════════════════════
  async function startCamera() {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment' } 
      });
      document.getElementById('wbVideo').srcObject = cameraStream;
    } catch (e) {
      alert('دسترسی به دوربین امکان‌پذیر نیست');
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
  }

  function capturePhoto() {
    const video = document.getElementById('wbVideo');
    const canvas = document.getElementById('wbCanvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    currentImage = canvas.toDataURL('image/jpeg', 0.85);
    document.getElementById('wbCameraPreviewImg').src = currentImage;
    document.getElementById('wbCameraPreview').style.display = 'block';
    runAnalysis();
  }

  function clearCameraImage() {
    currentImage = null;
    currentAnalysis = null;
    document.getElementById('wbCameraPreviewImg').src = '';
    document.getElementById('wbCameraPreview').style.display = 'none';
    document.getElementById('wbAnalysis').style.display = 'none';
  }

  // ═══════════════════════════════════════════════════════════════
  // 🤖 AI Analysis
  // ═══════════════════════════════════════════════════════════════
  async function runAnalysis() {
    if (!currentImage) return;
    const analysisDiv = document.getElementById('wbAnalysis');
    const resultDiv = document.getElementById('wbAnalysisResult');
    analysisDiv.style.display = 'block';
    resultDiv.innerHTML = '<div style="display:flex;align-items:center;gap:10px"><span class="wb-loading"></span><span>در حال تحلیل...</span></div>';

    try {
      currentAnalysis = await CVEngine.analyze(currentImage);

      // پر کردن خودکار فرم
      const suggestedName = currentAnalysis.type.type + ' ' + currentAnalysis.primaryColor;
      document.getElementById('wbName').value = suggestedName;

      // انتخاب دسته
      const catSelect = document.getElementById('wbCategory');
      for (const opt of catSelect.options) {
        if (opt.value === currentAnalysis.type.type) {
          opt.selected = true;
          break;
        }
      }

      // نمایش نتایج
      resultDiv.innerHTML = `
        <div class="wb-analysis-row">
          <span class="wb-analysis-label">📌 نوع:</span>
          <span class="wb-analysis-value">${currentAnalysis.type.type}</span>
          <div class="wb-analysis-bar"><div class="wb-analysis-fill" style="width:${currentAnalysis.type.confidence * 100}%"></div></div>
        </div>
        <div class="wb-analysis-row">
          <span class="wb-analysis-label">🎨 رنگ اصلی:</span>
          <span class="wb-analysis-value">
            <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${currentAnalysis.primaryHex};border:1px solid #ddd;vertical-align:middle;margin-left:4px"></span>
            ${currentAnalysis.primaryColor}
          </span>
        </div>
        <div class="wb-analysis-row">
          <span class="wb-analysis-label">🧵 جنس (تخمینی):</span>
          <span class="wb-analysis-value">${currentAnalysis.material.material}</span>
          <div class="wb-analysis-bar"><div class="wb-analysis-fill" style="width:${currentAnalysis.material.confidence * 100}%"></div></div>
        </div>
        <div class="wb-analysis-row">
          <span class="wb-analysis-label">💎 سبک:</span>
          <span class="wb-analysis-value">${currentAnalysis.styles.join('، ')}</span>
        </div>
        <div class="wb-analysis-row">
          <span class="wb-analysis-label">📅 فصل:</span>
          <span class="wb-analysis-value">${currentAnalysis.seasons.join('، ')}</span>
        </div>
        <div class="wb-analysis-row">
          <span class="wb-analysis-label">🎯 مناسبت:</span>
          <span class="wb-analysis-value">${currentAnalysis.occasions.join('، ')}</span>
        </div>
        <div class="wb-analysis-row">
          <span class="wb-analysis-label">🔷 الگو:</span>
          <span class="wb-analysis-value">${currentAnalysis.pattern.pattern}</span>
        </div>
        <div class="wb-analysis-row">
          <span class="wb-analysis-label">✨ روشنایی:</span>
          <span class="wb-analysis-value">${currentAnalysis.brightness}/255</span>
        </div>
      `;

      // Render color picker
      renderColorPicker();
    } catch (e) {
      resultDiv.innerHTML = '<span style="color:var(--danger)">خطا در تحلیل: ' + e.message + '</span>';
    }
  }

  function renderColorPicker() {
    const grid = document.getElementById('wbColorGrid');
    const allColors = ['مشکی', 'سفید', 'طوسی', 'کرم', 'قهوه‌ای', 'طلایی', 'نقره‌ای', 'قرمز', 'زرشکی', 'مسی', 'خردلی', 'نارنجی', 'صورتی', 'گلبهی', 'آبی', 'سرمه‌ای', 'آبی آسمانی', 'فیروزه‌ای', 'سبز', 'سبز روشن', 'بنفش', 'یاسی', 'زرد'];
    
    grid.innerHTML = allColors.map(c => `
      <button type="button" class="wb-color-opt ${c === currentAnalysis?.primaryColor ? 'is-on' : ''}" data-color="${c}" onclick="selectColor(this, '${c}')">
        <span class="wb-color-opt-dot" style="background:${colorHex(c)}"></span>
        <span>${c}</span>
      </button>
    `).join('');
  }

  let selectedColor = null;
  window.selectColor = function(btn, color) {
    document.querySelectorAll('.wb-color-opt').forEach(b => b.classList.remove('is-on'));
    btn.classList.add('is-on');
    selectedColor = color;
  };

  // ═══════════════════════════════════════════════════════════════
  // 💾 Save
  // ═══════════════════════════════════════════════════════════════
  function saveGarment() {
    if (!currentImage) {
      alert('لطفاً عکس لباس را انتخاب کنید');
      return;
    }

    const item = {
      id: 'wb_' + Date.now().toString(36),
      name: document.getElementById('wbName').value.trim() || 'لباس جدید',
      category: document.getElementById('wbCategory').value,
      primaryColor: selectedColor || currentAnalysis?.primaryColor || 'نامشخص',
      primaryHex: colorHex(selectedColor || currentAnalysis?.primaryColor),
      price: parseInt(document.getElementById('wbPrice').value) || 0,
      tags: document.getElementById('wbTags').value.split(',').map(t => t.trim()).filter(Boolean),
      image: currentImage,
      analysis: currentAnalysis,
      createdAt: Date.now(),
      favorite: false
    };

    addItem(item);
    closeModal();
    loadWardrobe();
    alert('✅ لباس به کمد اضافه شد!');
  }

  // ═══════════════════════════════════════════════════════════════
  // 🎨 Outfit Generator
  // ═══════════════════════════════════════════════════════════════
  function generateOutfits() {
    const wardrobe = getWardrobe();
    if (wardrobe.length < 2) {
      alert('حداقل ۲ لباس برای ساخت ست نیاز دارید');
      return;
    }

    if (!window.DPGodStylist) {
      alert('موتور استایلیست در دسترس نیست');
      return;
    }

    const result = window.DPGodStylist.buildOutfits(wardrobe, { occasion: 'روزمره', season: 'چهار فصل' });

    const container = document.getElementById('wbOutfits');

    if (result.empty || !result.outfits) {
      container.innerHTML = `<div class="wb-empty"><div class="wb-empty-icon">🎨</div><h3>ست مناسبی یافت نشد</h3><p>${result.message || 'لباس‌های بیشتری اضافه کنید'}</p></div>`;
      return;
    }

    const realProducts = window.DPProductsHub ? window.DPProductsHub.all() : [];

    container.innerHTML = `
      <h2 class="wb-outfits-title">
        <span>🎨</span>
        <span>ست‌های پیشنهادی از کمد شما</span>
        <span style="background:var(--success);color:white;padding:4px 12px;border-radius:var(--r-full);font-size:14px">${result.outfits.length} ست</span>
      </h2>
      ${result.outfits.map((outfit, idx) => {
        const medals = ['🥇', '🥈', '🥉'];
        const recs = window.DPGodStylist.OutfitEngine 
          ? window.DPGodStylist.OutfitEngine.suggestProductsForOutfit(outfit, realProducts, 3)
          : (window.DPStylistEngine ? window.DPStylistEngine.OutfitEngine.suggestProductsForOutfit(outfit, realProducts, 3) : []);
        
        // تشخیص missing categories
        const cats = new Set(outfit.items.map(i => i.category));
        const missing = ['کت', 'کفش', 'اکسسوری'].filter(c => !cats.has(c));

        return `
          <div class="wb-outfit">
            <div class="wb-outfit-header">
              <h3 class="wb-outfit-name">
                <span>${medals[idx] || '✨'}</span>
                <span>${outfit.name}</span>
              </h3>
              <span class="wb-outfit-score">${outfit.score}٪ هماهنگی</span>
            </div>
            <div class="wb-outfit-items">
              ${outfit.items.map(item => `
                <div class="wb-outfit-item">
                  <div class="wb-outfit-item-img">
                    ${item.image ? `<img src="${item.image}" alt="${esc(item.name)}" onerror="this.parentElement.innerHTML='👕'" />` : '👕'}
                  </div>
                  <h5 class="wb-outfit-item-name">${esc(item.name)}</h5>
                  <p class="wb-outfit-item-cat">${item.category}</p>
                </div>
              `).join('')}
              ${missing.slice(0, 2).map(m => `
                <div class="wb-outfit-item is-missing">
                  <div class="wb-outfit-item-img">❓</div>
                  <h5 class="wb-outfit-item-name">${m}</h5>
                  <p class="wb-outfit-item-cat">کم دارید</p>
                </div>
              `).join('')}
            </div>
            <div class="wb-outfit-tip">
              💡 ${outfit.explanation || 'ترکیب پیشنهادی AI از کمد شما'}
            </div>
            ${recs.length > 0 ? `
              <h4 class="wb-recs-title">🛍️ تکمیل ست با محصولات فروشگاه:</h4>
              <div class="wb-recs">
                ${recs.map(p => {
                  const img = p.image || (p.images && p.images[0]) || '';
                  return `
                    <a href="./product.html?id=${encodeURIComponent(p.id)}" class="wb-rec">
                      <div class="wb-rec-img">
                        ${img ? `<img src="${img}" loading="lazy" alt="${esc(p.name)}" onerror="this.parentElement.innerHTML='🛍️'" />` : '🛍️'}
                        ${p.suggestReason ? `<span class="wb-rec-match">${p.suggestReason}</span>` : ''}
                      </div>
                      <div class="wb-rec-info">
                        <h5 class="wb-rec-name">${esc(p.name)}</h5>
                        <p class="wb-rec-price">${Number(p.price || 0).toLocaleString('fa-IR')}</p>
                      </div>
                    </a>
                  `;
                }).join('')}
              </div>
            ` : ''}
            <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
              <button class="wb-btn wb-btn-ghost" onclick="alert('💾 ست ذخیره شد')">💾 ذخیره ست</button>
              <button class="wb-btn wb-btn-primary" onclick="window.location.href='./cart.html'">🛒 افزودن به سبد</button>
            </div>
          </div>
        `;
      }).join('')}
    `;

    document.getElementById('wbStatOutfits').textContent = toFa(result.outfits.length);
    container.scrollIntoView({ behavior: 'smooth' });
  }

  // ═══════════════════════════════════════════════════════════════
  // ⚡ Quick Fill (نمونه‌های آماده)
  // ═══════════════════════════════════════════════════════════════
  function quickFill() {
    if (!confirm('۱۷ لباس نمونه به کمد شما اضافه شود؟')) return;

    const samples = [
      { name: 'پیراهن سفید ساده', cat: 'پیراهن', color: 'سفید', hex: '#fff' },
      { name: 'پیراهن آبی روشن', cat: 'پیراهن', color: 'آبی آسمانی', hex: '#7dd3fc' },
      { name: 'بلوز مشکی', cat: 'بلوز', color: 'مشکی', hex: '#1a1a1a' },
      { name: 'تی‌شرت سفید', cat: 'تیشرت', color: 'سفید', hex: '#fff' },
      { name: 'تی‌شرت طوسی', cat: 'تیشرت', color: 'طوسی', hex: '#888' },
      { name: 'کت سرمه‌ای', cat: 'کت', color: 'سرمه‌ای', hex: '#1e3a8a' },
      { name: 'کت بلیزر طوسی', cat: 'کت', color: 'طوسی', hex: '#888' },
      { name: 'پالتو بژ', cat: 'پالتو', color: 'بژ', hex: '#d9c4a9' },
      { name: 'شلوار جین آبی', cat: 'شلوار', color: 'آبی', hex: '#3b82f6' },
      { name: 'شلوار مشکی پارچه‌ای', cat: 'شلوار', color: 'مشکی', hex: '#1a1a1a' },
      { name: 'شلوار کرم', cat: 'شلوار', color: 'کرم', hex: '#fef3c7' },
      { name: 'دامن مشکی میدی', cat: 'دامن', color: 'مشکی', hex: '#1a1a1a' },
      { name: 'کفش رسمی مشکی', cat: 'کفش', color: 'مشکی', hex: '#1a1a1a' },
      { name: 'کفش کتانی سفید', cat: 'کفش', color: 'سفید', hex: '#fff' },
      { name: 'کفش پاشنه‌دار مشکی', cat: 'کفش', color: 'مشکی', hex: '#1a1a1a' },
      { name: 'کیف دستی قهوه‌ای', cat: 'اکسسوری', color: 'قهوه‌ای', hex: '#78350f' },
      { name: 'شال طلایی', cat: 'اکسسوری', color: 'طلایی', hex: '#d4af37' }
    ];

    samples.forEach(s => {
      addItem({
        id: 'wb_sample_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name: s.name,
        category: s.cat,
        primaryColor: s.color,
        primaryHex: s.hex,
        price: Math.floor(Math.random() * 1500000) + 300000,
        tags: ['نمونه'],
        image: null,
        createdAt: Date.now(),
        favorite: false
      });
    });

    loadWardrobe();
    alert('⚡ ۱۷ لباس نمونه اضافه شد!');
  }

  // ═══════════════════════════════════════════════════════════════
  // 🎬 Init
  // ═══════════════════════════════════════════════════════════════
  function init() {
    setupMethodTabs();
    setupUpload();
    
    document.querySelectorAll('.wb-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.wb-tab').forEach(t => t.classList.remove('is-on'));
        tab.classList.add('is-on');
        currentCat = tab.dataset.cat;
        loadWardrobe();
      };
    });

    loadWardrobe();

    // بارگذاری محصولات واقعی از Hub
    setTimeout(() => {
      if (window.DPProductsHub && window.DPProductsHub.fetch) {
        window.DPProductsHub.fetch();
      }
    }, 500);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  </script>
</body>
